name: pages

# Serves the in-browser Blazor WebAssembly demo for the public demo repo. The private repo's CI
# (wasm-pages.yml) builds the standalone WASM static site and pushes it into this repo under app/;
# this workflow then publishes app/ to GitHub Pages at the site root. It also runs on release
# (published) and on demand. This repo is PUBLIC, so GitHub Pages is free.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (WASM app, or a placeholder until the first publish)
        run: |
          if [ -f app/index.html ]; then
            echo "Serving the published in-browser WASM demo from app/."
          else
            echo "No WASM app published yet; serving a placeholder landing page."
            mkdir -p app
            cat > app/index.html <<'EOF'
            <!doctype html>
            <html lang="en"><head><meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>eManagerSimulationHandler — demo</title>
            <style>body{font-family:system-ui,sans-serif;max-width:48rem;margin:4rem auto;padding:0 1rem;line-height:1.6}</style>
            </head><body>
            <h1>eManagerSimulationHandler — demo</h1>
            <p>The in-browser WebAssembly demo is being published. Please check back shortly.</p>
            <p><a href="https://github.com/BenSieElementLogic/eManagerSimulationHandler-releases/releases">Downloads &amp; releases &rarr;</a></p>
            </body></html>
            EOF
          fi
          # _framework starts with an underscore, which Jekyll would strip — disable Jekyll.
          touch app/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
